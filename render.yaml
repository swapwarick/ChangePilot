# Render Blueprint — ChangePilot full-stack deployment
# https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Push this file to your GitHub repo (root directory)
#   2. Go to Render Dashboard → New → Blueprint
#   3. Connect your repo — Render will create all services automatically
#   4. Set the secret env vars marked with `generateValue: false` in the Render dashboard

services:
  # ---------------------------------------------------------------------------
  # Backend — FastAPI
  # ---------------------------------------------------------------------------
  - type: web
    name: changepilot-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free         # Change to "starter" or higher for production
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: BACKEND_CORS_ORIGINS
        fromService:
          name: changepilot-frontend
          type: web
          property: host
          format: "https://{host}"
      - key: DATABASE_URL
        fromDatabase:
          name: changepilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: changepilot-redis
          type: redis
          property: connectionString
      # Neo4j Aura — set these manually in the Render dashboard
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      # Auth secrets — generate with: openssl rand -hex 32
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: STORAGE_QUOTA_BYTES
        value: "31457280"
      - key: IS_CLOUD
        value: "true"

  # ---------------------------------------------------------------------------
  # Frontend — Next.js
  # ---------------------------------------------------------------------------
  - type: web
    name: changepilot-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: oregon
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          name: changepilot-api
          type: web
          property: host
          format: "https://{host}"
      - key: NEXT_PUBLIC_IS_CLOUD
        value: "true"
      # Better Auth (used by Next.js auth adapter)
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        fromService:
          name: changepilot-frontend
          type: web
          property: host
          format: "https://{host}"

  # ---------------------------------------------------------------------------
  # Redis — job queue
  # ---------------------------------------------------------------------------
  - type: redis
    name: changepilot-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  # ---------------------------------------------------------------------------
  # PostgreSQL — main database
  # ---------------------------------------------------------------------------
  - name: changepilot-db
    databaseName: changepilot
    user: changepilot
    plan: free
    region: oregon
